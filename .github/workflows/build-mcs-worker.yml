name: Build MCS worker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/build-mcs-worker.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: mcs-worker-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ghcr.io/debeaux13-cloud/cajun-country:mcs-worker-v23
            ghcr.io/debeaux13-cloud/cajun-country:mcs-worker-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Make image publicly pullable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH /user/packages/container/cajun-country -f visibility=public
      - name: Verify anonymous pull
        run: |
          docker logout ghcr.io
          docker pull ghcr.io/debeaux13-cloud/cajun-country:mcs-worker-v23
